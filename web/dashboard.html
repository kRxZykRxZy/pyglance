<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi Monitor</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header><h1>Pi Monitor</h1><span>● ONLINE</span><div class=actions><button onclick="logout()">Logout</button><button onclick="shutdownPi()">Shutdown</button></div></header>
<nav><button class=active data-tab=overview>Overview</button><button data-tab=processes>Processes</button><button data-tab=ports>Ports</button><button data-tab=network>Network</button><button data-tab=terminal>Terminal</button></nav>
<main>
<section id=overview class="tab show"><div class=grid><div class=card>CPU<strong id=cpu>--</strong></div><div class=card>RAM<strong id=ram>--</strong></div><div class=card>Disk<strong id=disk>--</strong></div><div class=card>Uptime<strong id=uptime>--</strong></div></div></section>
<section id=processes class=tab><div class=card><h2>Processes</h2><div id=processList>Loading...</div></div></section>
<section id=ports class=tab><div class=card><h2>Open Ports</h2><div id=portList>Loading...</div></div></section>
<section id=network class=tab><div class=grid><div class=card>Received<strong id=rx>--</strong></div><div class=card>Transmitted<strong id=tx>--</strong></div></div></section>
<section id=terminal class=tab><div class=card><h2>Terminal</h2><pre id=terminalOutput>Pi Monitor terminal\n</pre><form id=terminalForm><input id=terminalInput autocomplete=off placeholder="Enter a command..."><button type=submit>Run</button></form></div></section>
</main><script src=/app.js></script></body></html>
